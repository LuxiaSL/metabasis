[project]
name = "metabasis"
version = "0.1.0"
description = "Steering-vector transport between language models via closed-form linear change of basis — the law, the protocol, the class split."
requires-python = ">=3.11"
# The CPU algebra spine (fit/rosetta/star/curverows/composition and every
# readout that consumes them) needs ONLY these three — it runs anywhere,
# no GPU, no torch.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# GPU-side: state collection (slim collector) + behavioral write probes.
gpu = [
    "torch>=2.1",
    "transformers>=4.36",
    # device_map dispatch for the sharded (>=70B) collection path; lazily
    # imported, so single-card collection runs without it.
    "accelerate>=0.26",
]
# Corpus building (one parquet source format, lazy import).
corpus = ["pyarrow"]
# Blind-2AFC judge harness (lazy import; key via env only, never node-side).
judge = ["anthropic"]
# Whitened-vector builder (LedoitWolf, lazy import).
whiten = ["scikit-learn>=1.4"]
# Plots (a8_leg4_coupling only, lazy import).
plots = ["matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metabasis"]
