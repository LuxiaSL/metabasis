[project]
name = "metabasis"
version = "0.1.0"
description = "Steering-vector transport between language models through linear maps fit on shared generic text."
requires-python = ">=3.11"
# The CPU algebra (map fitting, composition and the readouts that consume
# them) needs only these three: it runs anywhere, with no GPU and no torch.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# GPU side: state collection and behavioral steering runs.
gpu = [
    "torch>=2.1",
    "transformers>=4.36",
    # device_map dispatch for sharded collection of models too large for one
    # GPU; lazily imported, so single-GPU collection runs without it.
    "accelerate>=0.26",
]
# Corpus building (one parquet source format, lazy import).
corpus = ["pyarrow"]
# Blind two-alternative judge harness (lazy import; the API key comes from the environment).
judge = ["anthropic"]
# Whitened-vector builder (LedoitWolf, lazy import).
whiten = ["scikit-learn>=1.4"]
# Plots (lazy import).
plots = ["matplotlib"]
# The test suite and the documentation gates under tools/ (the gates themselves
# are standard library only; pytest runs their fixture corpus).
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metabasis"]

# The gate tools live in the top-level `tools` package, which the wheel does not
# ship; `pythonpath` puts it on the import path when the suite runs from a checkout.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
